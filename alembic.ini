# Alembic configuration file.

[alembic]
# Path to the directory containing env.py and the versions/ sub-directory
script_location = alembic

# Template used to name new migration files.
# %(year)04d%(month)02d%(day)02d_%(rev)s_%(slug)s.py
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s

# Prepend sys.path with the project root so that `app` can be imported
prepend_sys_path = .

# Timezone for `alembic revision --autogenerate` timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
